[project]
name = "oleoweb-api"
version = "0.1.0"
description = "API del Portal Oleofinos (FastAPI). Solo escucha en localhost; la consume el servidor de Next.js."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.6",
    "pyodbc==5.3.0",
    "pydantic-settings==2.16.2",
    "email-validator==2.3.0",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "keyring==25.7.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
