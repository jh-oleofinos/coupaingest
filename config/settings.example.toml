# Copia este archivo como config/settings.toml y ajusta los valores.
# Aquí NO van secretos: el client secret de Graph y la API key de Coupa
# se guardan con `coupa-ingest secrets set` en el Administrador de credenciales.

ambiente = "dev"            # dev | prd
data_dir = "data"           # copias por corrida: data/runs/<run_id>/
log_dir = "logs"
retention_days = 90         # días que se guardan data/runs y logs (0 = nunca borrar)
# Si el archivo no cambió desde la última corrida exitosa:
#   "send" = envía de todos modos · "skip" = no envía, termina OK · "fail" = termina con error
if_unchanged = "send"

[sharepoint]
# "usuario": se inicia sesión una vez con `coupa-ingest login` usando una cuenta que
#            ya puede abrir el archivo; el token se guarda cifrado y se renueva solo.
# "app":     app de Entra ID con Sites.Selected + graph_client_secret (lo da TI).
auth = "usuario"
tenant_id = "oleofinos.com.mx"
# Enlace del archivo (OneDrive de Simón Dorado). Se ubica por su id, así que
# sigue funcionando aunque cambie de nombre o de carpeta.
file_url = "https://oleofinos1-my.sharepoint.com/:x:/r/personal/simon_dorado_oleofinos_com_mx/_layouts/15/Doc.aspx?sourcedoc=%7B0c4f3954-eb9c-4c38-b37b-781ecf6131ef%7D"
timeout_s = 120
# Solo para auth = "app" o si se ubica por ruta en lugar de enlace:
# client_id = "00000000-0000-0000-0000-000000000000"
# hostname = "oleofinos1-my.sharepoint.com"
# site_path = "/personal/simon_dorado_oleofinos_com_mx"
# file_path = "/Carpeta/Archivo.xlsx"

[coupa]
base_url = "https://api.llama.ai"   # host del documento de Coupa (llama.ai)
model_id = "PENDIENTE"              # id del modelo destino; lo da Coupa (`coupa-ingest modelos` lista los visibles)
timeout_s = 60
batch_rows = 5000           # filas por PUT (JSON); ajustar al límite que indique Coupa
poll_interval_s = 10
poll_max_min = 30

# Pestañas: por defecto se procesan TODAS las del libro, cada una a su propio CSV.
# La tabla destino en Coupa es el nombre de la pestaña, salvo que se indique otra abajo.
all_sheets = true
include_hidden_sheets = false   # las pestañas ocultas no se envían
allow_empty_sheets = false      # una pestaña sin filas detiene la corrida
exclude_sheets = []             # p. ej. ["Instrucciones", "Hoja1"]

# Opcional: tabla destino y columnas llave por pestaña (para validar duplicados).
# [[sheets]]
# sheet = "VW_YVA05"
# table = "VW_YVA05"
# key = ["COLUMNA_LLAVE"]
